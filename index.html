<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.Com Prog & Hons Made Simple</title>
<style>
  :root{
    --paper: #F6F1E4;
    --ink: #1B2A4A;
    --ink-soft: #435071;
    --red: #A6362C;
    --gold: #B8912E;
    --line: #DCD3BC;
    --card: #FFFEFA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    line-height:1.5;
  }
  header{
    border-bottom: 2px solid var(--ink);
    padding: 20px 24px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  header .brand{ font-size: 22px; font-weight:700; }
  header .brand span{ color: var(--red); }
  header nav{ font-family: -apple-system, sans-serif; font-size: 14px; color: var(--ink-soft); }

  .view{ display:none; }
  .view.active{ display:block; }

  .gate-wrap{ min-height: 78vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .gate-box{ max-width: 380px; width:100%; }
  .gate-box .stamp{
    display:inline-block; border: 1.5px solid var(--red); color: var(--red);
    font-family: -apple-system, sans-serif; font-size: 12px; padding: 3px 10px;
    border-radius: 3px; transform: rotate(-2deg); margin-bottom: 16px;
  }
  .gate-box h1{ font-size: 26px; font-weight:400; margin-bottom: 8px; }
  .gate-box p{ font-family:-apple-system, sans-serif; color:var(--ink-soft); font-size:14px; margin-bottom:22px; }
  .field{ margin-bottom: 14px; }
  .field label{ font-family:-apple-system, sans-serif; font-size:12.5px; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .field input{
    width:100%; font-family:-apple-system, sans-serif; font-size:15px;
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--card); color: var(--ink);
  }
  .field input:focus{ outline: none; border-color: var(--red); }
  .gate-btn{
    width:100%; font-family:-apple-system, sans-serif; font-size:15px; font-weight:600;
    background: var(--ink); color: var(--paper); border:none; padding:13px; border-radius:4px;
    cursor:pointer; margin-top: 6px;
  }
  .gate-err{ font-family:-apple-system, sans-serif; font-size:12.5px; color: var(--red); margin-top:8px; display:none; }

  .hero{ padding: 44px 24px 30px; max-width: 720px; }
  .hero .stamp{
    display:inline-block; border: 1.5px solid var(--red); color: var(--red);
    font-family: -apple-system, sans-serif; font-size: 12px; padding: 3px 10px;
    border-radius: 3px; transform: rotate(-2deg); margin-bottom: 18px;
  }
  .hero h1{ font-size: 34px; line-height:1.15; margin-bottom: 10px; font-weight: 400; }
  .hero h1 em{ font-style: normal; color: var(--red); }
  .hero p{ font-family: -apple-system, sans-serif; color: var(--ink-soft); font-size: 15px; max-width: 520px; }

  .section-title{
    font-size: 15px; font-family: -apple-system, sans-serif; color: var(--ink-soft);
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin: 0 24px 18px; max-width:900px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .section-title .switch-sem{ color: var(--red); cursor:pointer; text-decoration:underline; }
  .grid{ display:grid; grid-template-columns: 1fr; gap: 12px; padding: 0 24px 50px; max-width: 900px; }
  .card{
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold);
    padding: 16px 18px; border-radius: 3px; cursor:pointer;
  }
  .card h3{ font-size:18px; font-weight:400; margin-bottom:4px; }
  .card p{ font-family: -apple-system, sans-serif; font-size: 13px; color: var(--ink-soft); }
  .card.dim{ opacity:.5; cursor:default; }
  .empty-note{ font-family:-apple-system, sans-serif; color:var(--ink-soft); font-size:14px; padding: 10px 0; }

  .back-link{
    font-family: -apple-system, sans-serif; font-size: 13px; color: var(--ink-soft);
    text-decoration:none; display:inline-block; margin: 18px 24px 0; cursor:pointer;
  }

  .subject-header{ padding: 10px 24px 0; max-width: 760px; }
  .subject-header h1{ font-size: 28px; font-weight: 400; margin: 6px 0 4px; }
  .subject-header .sub{ font-family:-apple-system, sans-serif; color:var(--ink-soft); font-size:13px; margin-bottom: 26px; }

  .cat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 24px 50px; max-width: 760px; }
  .cat-card{
    background: var(--card); border: 1px solid var(--line);
    padding: 22px 16px; border-radius: 4px; text-align:center; cursor:pointer;
  }
  .cat-card .tag{ font-family:-apple-system, sans-serif; font-size:11px; color: var(--red); margin-bottom:6px; letter-spacing:.3px; }
  .cat-card h3{ font-size: 19px; font-weight: 400; }
  .cat-card p{ font-family:-apple-system, sans-serif; font-size:12px; color: var(--ink-soft); margin-top:4px; }

  .category-header{ padding: 10px 24px 4px; max-width: 760px; }
  .category-header h1{ font-size: 26px; font-weight: 400; }
  .category-header .sub{ font-family:-apple-system, sans-serif; color:var(--ink-soft); font-size:13px; margin-bottom: 20px; }

  .accordion{ padding: 0 24px 60px; max-width: 760px; }
  .chap-row{
    border: 1px solid var(--line); border-radius: 3px; margin-bottom: 10px; background: var(--card);
    padding: 15px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    font-family: -apple-system, sans-serif;
  }
  .chap-row .num{ color: var(--red); font-weight:600; margin-right:8px; }
  .chap-row .arrow{ color: var(--ink-soft); }

  .chapter-detail{ padding: 10px 24px 60px; max-width: 760px; }
  .chapter-detail h1{ font-size: 24px; font-weight: 400; margin: 6px 0 4px; }
  .chapter-detail .sub{ font-family:-apple-system, sans-serif; color:var(--ink-soft); font-size:13px; margin-bottom: 22px; }
  .chapter-detail h4{ font-size:16px; font-weight:600; margin: 12px 0 6px; }
  .chapter-detail h4:first-child{ margin-top:0; }
  .chapter-detail p, .chapter-detail li{ font-size: 15.5px; }
  .chapter-detail ul{ padding-left: 20px; margin-bottom: 8px; }

  .pyq{ border-left: 3px solid var(--red); padding: 10px 12px; margin-bottom: 8px; background: #FBF7EC; border-radius: 3px; }
  .pyq .ptag{ font-family: -apple-system, sans-serif; font-size: 11px; color: var(--red); margin-bottom: 3px; }

  footer{ text-align:center; padding: 30px; font-family:-apple-system, sans-serif; font-size: 12.5px; color: var(--ink-soft); }
</style>
</head>
<body>

<header>
  <div class="brand">B.Com<span>.</span>Notes</div>
  <nav>B.Com Prog &amp; Hons</nav>
</header>

<div class="view active" id="view-gate">
  <div class="gate-wrap">
    <div class="gate-box">
